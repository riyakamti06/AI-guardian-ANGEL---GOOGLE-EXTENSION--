
name: CI/CD - Guardian AI Angel

on:
  push:
    branches:
      - main
      - ci-cd-improvements
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check extension files exist
        shell: bash
        run: |
          test -f "google extension/manifest.json"
          test -f "google extension/background.js"
          test -f "google extension/popup.html"
          test -f "google extension/popup.js"

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          find "google extension" -type f -name "*.js" -print0 |
          while IFS= read -r -d '' file; do
            echo "Checking: $file"
            node --check "$file" || exit 1
          done

      - name: Package extension
        shell: bash
        run: |
          cd "google extension"
          zip -r ../guardian-ai-angel-extension.zip .

      - name: Upload extension ZIP
        uses: actions/upload-artifact@v4
        with:
          name: guardian-ai-angel-extension
          path: guardian-ai-angel-extension.zip
          if-no-files-found: error